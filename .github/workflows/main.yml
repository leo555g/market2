name: Update Market Data

on:
  schedule:
    - cron: '10 0 * * *'    # 台灣時間 08:10 (美股收盤與盤後結算)
    - cron: '50 5 * * 1-5'  # 台灣時間 13:50 (台股收盤第一波更新)
    - cron: '45 6 * * 1-5'  # 台灣時間 14:45 (台股盤後三大法人更新)
    - cron: '35 8 * * 1-5'  # 台灣時間 16:35 (台股融資與完整盤後更新)
    - cron: '30 14 * * 1-5' # 台灣時間 22:30 (美股開盤即時更新)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'update_data.py'
      - 'supply_chain_db.js'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: market-data-sync
  cancel-in-progress: true

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install yfinance pandas requests pytz urllib3 opencc-python-reimplemented lxml

      - name: Run update_data.py
        run: |
          python update_data.py

      - name: Commit and Push updated market_data.json safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp data/market_data.json /tmp/market_data.json.bak
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data
          mv /tmp/market_data.json.bak data/market_data.json
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "Auto-update market_data.json [skip ci]"
          git push origin main
