name: Daily Market Data Update

on:
  schedule:
    - name: Daily Market Data Update

on:
  schedule:
    - cron: '30 8 * * 1-5' # UTC 08:30 = 台灣時間 下午 16:30 (更新台股)
    - cron: '0 23 * * 0-4' # UTC 23:00 = 台灣時間 早上 07:00 (更新美股，因跨日所以是 0-4)
  workflow_dispatch:

jobs:
  update-data:
# (下方保持原樣不要動)

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案代碼
        uses: actions/checkout@v4
        
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 安裝相依套件
        run: pip install -r requirements.txt
        
      - name: 執行資料更新腳本
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
        run: python update_data.py
        
      - name: 提交更新後的 data.js
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m "Auto-update market data" || exit 0
          git pull --rebase
          git push
