name: High-Frequency Market Data Update

on:
  schedule:
    # 每 15 分鐘執行一次 (涵蓋台股日夜盤、歐股、美股盤前/盤中/盤後)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 支援手動一鍵觸發
  push:
    branches:
      - main
    paths:
      - 'update_data.py'
      - 'index.html'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Market Data and Generate JSON
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
        run: |
          python update_data.py

      - name: Commit and Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update market data $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          fi
