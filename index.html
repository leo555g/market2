<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球市場數據監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function getColor(change) {
            if (change > 0) return 'text-red-500';
            if (change < 0) return 'text-green-500';
            return 'text-gray-500';
        }
        function getSign(change) {
            return change > 0 ? '+' : '';
        }
        
        // 繪製 SVG 迷你走勢圖 (含漸層底色)
        function createSparkline(sparkline, change) {
            if (!sparkline || sparkline.length < 2) return '';
            const width = 85;
            const height = 36;
            const min = Math.min(...sparkline);
            const max = Math.max(...sparkline);
            const range = (max - min) === 0 ? 1 : (max - min);
            
            const pts = sparkline.map((val, idx) => {
                const x = (idx / (sparkline.length - 1)) * width;
                const y = height - ((val - min) / range) * (height - 8) - 4;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            });
            
            const pointsStr = pts.join(' ');
            const strokeColor = change > 0 ? '#ef4444' : (change < 0 ? '#22c55e' : '#9ca3af');
            const fillColor = change > 0 ? 'rgba(239, 68, 68, 0.12)' : (change < 0 ? 'rgba(34, 197, 94, 0.12)' : 'rgba(156, 163, 175, 0.1)');
            const areaPoints = `0,${height} ${pointsStr} ${width},${height}`;

            return `
                <svg width="${width}" height="${height}" class="overflow-visible shrink-0 ml-2">
                    <polygon points="${areaPoints}" fill="${fillColor}" />
                    <polyline fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pointsStr}" />
                </svg>
            `;
        }

        function createCard(item) {
            const color = getColor(item.change);
            const sign = getSign(item.change);
            const showPct = item.price.includes('億') || item.price === '連線失敗' || item.price === '更新中';
            const changeText = (!showPct && item.change !== null) ? `${sign}${item.change}%` : '';
            const priceColor = showPct ? color : 'text-gray-900';
            const sparklineSvg = createSparkline(item.sparkline, item.change);
            
            return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition-shadow">
                    <div class="flex flex-col justify-between min-w-0">
                        <h3 class="text-gray-600 font-medium text-sm truncate">${item.name}</h3>
                        <div class="mt-2 flex items-baseline gap-2 flex-wrap">
                            <span class="text-2xl font-bold ${priceColor}">${item.price}</span>
                            <span class="text-xs font-semibold ${color}">${changeText}</span>
                        </div>
                    </div>
                    ${sparklineSvg}
                </div>
            `;
        }

        function createSection(title, sectionData) {
            if (!sectionData || sectionData.length === 0) return '';
            const cards = sectionData.map(createCard).join('');
            return `
                <div class="mb-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-4 border-l-4 border-blue-600 pl-3">${title}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                        ${cards}
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const timeEl = document.getElementById('update-time');
            if (typeof lastUpdate !== 'undefined') {
                timeEl.textContent = `最後更新時間：${lastUpdate}`;
            }
            let html = '';
            if (typeof data !== 'undefined' && Object.keys(data).length > 0) {
                for (const [title, items] of Object.entries(data)) {
                    html += createSection(title, items);
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">正在等待系統更新資料...</div>';
            }
        }
        
        window.onload = () => {
            const script = document.createElement('script');
            script.src = 'data.js?t=' + new Date().getTime();
            script.onload = renderDashboard;
            document.head.appendChild(script);
        };
    </script>
</head>
<body class="bg-gray-50 p-6 md:p-12 font-sans">
    <header class="mb-10 flex flex-col md:flex-row md:justify-between md:items-end">
        <div>
            <h1 class="text-3xl font-black text-gray-900">全球市場數據監控</h1>
            <p class="text-gray-500 mt-2">每日收盤後自動化更新</p>
        </div>
        <div id="update-time" class="text-sm text-gray-400 mt-2 md:mt-0"></div>
    </header>
    <main id="dashboard-content"></main>
</body>
</html>
