<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球市場數據監控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 深色模式下使用更明亮的紅綠配色，確保高對比清晰度
        function getColor(change) {
            if (change > 0) return 'text-red-400';
            if (change < 0) return 'text-emerald-400';
            return 'text-slate-400';
        }
        function getSign(change) {
            return change > 0 ? '+' : '';
        }
        
        // 繪製深色版 SVG 迷你走勢圖 (含微發光漸層底色)
        function createSparkline(sparkline, change) {
            if (!sparkline || sparkline.length < 2) return '';
            const width = 80;
            const height = 36;
            const min = Math.min(...sparkline);
            const max = Math.max(...sparkline);
            const range = (max - min) === 0 ? 1 : (max - min);
            
            const pts = sparkline.map((val, idx) => {
                const x = (idx / (sparkline.length - 1)) * width;
                const y = height - ((val - min) / range) * (height - 8) - 4;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            });
            
            const pointsStr = pts.join(' ');
            const strokeColor = change > 0 ? '#f87171' : (change < 0 ? '#34d399' : '#94a3b8');
            const fillColor = change > 0 ? 'rgba(248, 113, 113, 0.16)' : (change < 0 ? 'rgba(52, 211, 153, 0.16)' : 'rgba(148, 163, 184, 0.1)');
            const areaPoints = `0,${height} ${pointsStr} ${width},${height}`;

            return `
                <svg width="${width}" height="${height}" class="overflow-visible shrink-0 ml-2">
                    <polygon points="${areaPoints}" fill="${fillColor}" />
                    <polyline fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${pointsStr}" />
                </svg>
            `;
        }

        function createCard(item) {
            const color = getColor(item.change);
            const sign = getSign(item.change);
            const isChip = item.price.includes('億') || item.price === '連線失敗' || item.price === '更新中';
            
            // 組合「漲跌點數」與「漲跌幅百分比」：例如 +245.50 (+1.05%)
            let changeText = '';
            if (!isChip && item.change !== null) {
                if (item.diff !== undefined) {
                    changeText = `${item.diff} (${sign}${item.change}%)`;
                } else {
                    changeText = `${sign}${item.change}%`;
                }
            }
            
            const priceColor = isChip ? color : 'text-slate-100';
            const sparklineSvg = createSparkline(item.sparkline, item.change);
            
            return `
                <div class="bg-slate-900/90 p-4 rounded-xl shadow-lg border border-slate-800 flex items-center justify-between hover:border-slate-700 hover:bg-slate-800/80 transition-all">
                    <div class="flex flex-col justify-between min-w-0">
                        <h3 class="text-slate-400 font-medium text-sm truncate">${item.name}</h3>
                        <div class="mt-1.5 flex flex-col">
                            <span class="text-2xl font-bold ${priceColor} leading-tight tracking-tight">${item.price}</span>
                            ${changeText ? `<span class="text-xs font-semibold ${color} mt-1">${changeText}</span>` : ''}
                        </div>
                    </div>
                    ${sparklineSvg}
                </div>
            `;
        }

        function createSection(title, sectionData) {
            if (!sectionData || sectionData.length === 0) return '';
            const cards = sectionData.map(createCard).join('');
            return `
                <div class="mb-9">
                    <h2 class="text-xl font-bold text-slate-100 mb-4 border-l-4 border-blue-500 pl-3 tracking-wide">${title}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                        ${cards}
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const container = document.getElementById('dashboard-content');
            const timeEl = document.getElementById('update-time');
            if (typeof lastUpdate !== 'undefined') {
                timeEl.textContent = `最後更新時間：${lastUpdate}`;
            }
            let html = '';
            if (typeof data !== 'undefined' && Object.keys(data).length > 0) {
                for (const [title, items] of Object.entries(data)) {
                    html += createSection(title, items);
                }
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="p-8 text-center text-slate-500">正在等待系統更新資料...</div>';
            }
        }
        
        window.onload = () => {
            const script = document.createElement('script');
            script.src = 'data.js?t=' + new Date().getTime();
            script.onload = renderDashboard;
            document.head.appendChild(script);
        };
    </script>
</head>
<body class="bg-slate-950 text-slate-100 p-6 md:p-12 font-sans min-h-screen selection:bg-blue-500 selection:text-white">
    <header class="mb-10 flex flex-col md:flex-row md:justify-between md:items-end border-b border-slate-800/80 pb-6">
        <div>
            <h1 class="text-3xl font-black text-white tracking-tight">全球市場數據監控</h1>
            <p class="text-slate-400 mt-2 text-sm">每日早晚自動化更新（07:00 / 16:30）</p>
        </div>
        <div id="update-time" class="text-xs font-mono text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 mt-4 md:mt-0"></div>
    </header>
    <main id="dashboard-content"></main>
</body>
</html>
